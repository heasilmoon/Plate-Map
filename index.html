<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Plate Map Tracker</title>
<link rel="icon" type="image/png" href="en/icons/icon-192.png">
<meta name="theme-color" content="#0f6e7a">
<script>
(function(){ var pick=null; try{ pick=localStorage.getItem("plate-tracker-lang"); }catch(e){}
  if(!pick) pick=(navigator.language||"").toLowerCase().indexOf("ko")===0 ? "ko" : "en";
  location.replace(pick + "/"); })();
</script>
<style>
:root{--bg:#f3f5f6;--fg:#1b2428;--muted:#5f6d73;--accent:#0f6e7a;--line:#d3d9dc}
@media (prefers-color-scheme: dark){:root{--bg:#121719;--fg:#e3e9eb;--muted:#93a2a8;--accent:#4fb6c2;--line:#2f3a3f;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;padding-inline:16px;padding-block:20vh 32px;text-align:center}
h1{font-size:20px;margin:0 0 6px} p{color:var(--muted);margin:0 0 20px}
a{display:inline-block;margin:4px;padding:10px 18px;border:1px solid var(--accent);border-radius:8px;color:var(--accent);text-decoration:none;font-weight:600}
</style>
</head>
<body>
<h1>Plate Map Tracker</h1>
<p>Choose a language · 언어를 선택하세요</p>
<a href="ko/" lang="ko">한국어</a><a href="en/">English</a>
</body>
</html>
